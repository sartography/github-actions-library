name: "BPMN Diagram PR Preview"
description: "Automatically generates visual previews of BPMN diagram changes in pull requests"
author: "GitHub Actions Library"

inputs:
  image_store_api_key:
    description: "Image store API key"
    required: true

outputs:
  uploaded_urls:
    description: "JSON object mapping BPMN file paths to their uploaded image URLs"
    value: ${{ steps.render-and-upload.outputs.uploaded_urls }}

runs:
  using: "composite"
  steps:
    - name: Check if this is a pull request event
      id: check-event
      shell: bash
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "This action is designed for pull request events only. Current event: ${{ github.event_name }}"
          echo "Skipping BPMN diagram processing..."
          echo "is_pr=false" >> $GITHUB_OUTPUT
        else
          echo "Confirmed this is a pull request event. Proceeding..."
          echo "is_pr=true" >> $GITHUB_OUTPUT
        fi

    - name: Project setup
      if: steps.check-event.outputs.is_pr == 'true'
      uses: bpmn-io/actions/setup@latest

    - name: Use Node.js
      if: steps.check-event.outputs.is_pr == 'true'
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Install dependencies
      if: steps.check-event.outputs.is_pr == 'true'
      shell: bash
      run: |
        echo "Installing dependencies"
        cd "$GITHUB_WORKSPACE"
        npm install bpmn-to-image node-fetch form-data

    - name: Get changed BPMN file paths
      if: steps.check-event.outputs.is_pr == 'true'
      id: get-bpmn-files
      shell: bash
      run: |
        echo "Getting changed BPMN file paths"
        # Make the script executable and run it
        chmod +x ${{ github.action_path }}/scripts/get_changed_bpmn_files.sh
        BPMN_FILES_LIST=$(${{ github.action_path }}/scripts/get_changed_bpmn_files.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
        echo "Detected BPMN files: $BPMN_FILES_LIST" >&2
        # Set output as a multi-line string
        echo "bpmn_files_list<<EOF" >> $GITHUB_OUTPUT
        echo "$BPMN_FILES_LIST" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Render BPMN before and after and upload to image store
      if: steps.check-event.outputs.is_pr == 'true'
      id: render-and-upload
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IMAGE_STORE_API_URL: "https://qsnszlmyxesikwhheaaq.supabase.co/functions/v1/image-store-api"
        SUPABASE_ANON_KEY: ${{ inputs.image_store_api_key }}
      run: |
        echo "Starting BPMN rendering and upload"
        BPMN_FILES_LIST="${{ steps.get-bpmn-files.outputs.bpmn_files_list }}"
        if [ -z "$BPMN_FILES_LIST" ]; then
          echo "No BPMN files to process. Skipping rendering and upload."
          echo "uploaded_urls={}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Convert multi-line string to array of arguments, handling potential spaces in paths
        ARGS=()
        while IFS= read -r file; do
          if [ -n "$file" ]; then
            ARGS+=("$file")
          fi
        done <<< "$BPMN_FILES_LIST"

        echo "Processing BPMN files: ${ARGS[@]}" >&2

        # Copy the script to workspace where node_modules was installed, then run it
        cp ${{ github.action_path }}/scripts/render.mjs "$GITHUB_WORKSPACE/render.mjs"
        UPLOADED_URLS=$(cd "$GITHUB_WORKSPACE" && node render.mjs "${ARGS[@]}" | tail -n 1)
        echo "Uploaded URLs JSON: $UPLOADED_URLS" >&2
        echo "uploaded_urls=$UPLOADED_URLS" >> $GITHUB_OUTPUT

    - name: Create PR comment with diagrams
      if: steps.check-event.outputs.is_pr == 'true'
      uses: actions/github-script@v7
      env:
        UPLOADED_URLS_JSON: ${{ steps.render-and-upload.outputs.uploaded_urls }}
      with:
        script: |
          const uploadedUrls = JSON.parse(process.env.UPLOADED_URLS_JSON || '{}');
          let commentBody = `## BPMN Diagram Changes\n\n`;

          if (Object.keys(uploadedUrls).length === 0) {
            commentBody += `_No BPMN diagrams were added or modified in this pull request._`;
          } else {
            // Separate files by status and sort alphabetically
            const addedFiles = [];
            const modifiedFiles = [];
            const errorFiles = [];

            for (const bpmnFilePath in uploadedUrls) {
              const fileData = uploadedUrls[bpmnFilePath];
              if (fileData.error) {
                errorFiles.push(bpmnFilePath);
              } else if (fileData.status === 'A') {
                addedFiles.push(bpmnFilePath);
              } else {
                modifiedFiles.push(bpmnFilePath);
              }
            }

            // Sort all arrays alphabetically
            addedFiles.sort();
            modifiedFiles.sort();
            errorFiles.sort();

            // Process added files first
            if (addedFiles.length > 0) {
              commentBody += `### New Files\n\n`;
              for (const bpmnFilePath of addedFiles) {
                const { afterUrl } = uploadedUrls[bpmnFilePath];
                commentBody += `#### \`${bpmnFilePath}\`\n\n`;
                commentBody += `![Diagram](${afterUrl})\n\n`;
                commentBody += `---\n\n`;
              }
            }

            // Process modified files next
            if (modifiedFiles.length > 0) {
              commentBody += `### Modified Files\n\n`;
              for (const bpmnFilePath of modifiedFiles) {
                const { beforeUrl, afterUrl } = uploadedUrls[bpmnFilePath];
                commentBody += `#### \`${bpmnFilePath}\`\n\n`;
                if (beforeUrl) {
                  commentBody += `**Before**\n`;
                  commentBody += `![Before Diagram](${beforeUrl})\n\n`;
                  commentBody += `**After**\n`;
                  commentBody += `![After Diagram](${afterUrl})\n\n`;
                } else {
                  commentBody += `![Diagram](${afterUrl})\n\n`;
                }
                commentBody += `---\n\n`;
              }
            }

            // Process error files last
            if (errorFiles.length > 0) {
              commentBody += `### Processing Errors\n\n`;
              for (const bpmnFilePath of errorFiles) {
                const { error } = uploadedUrls[bpmnFilePath];
                commentBody += `#### \`${bpmnFilePath}\`\n\n`;
                commentBody += `_Error processing this file: ${error}_\n\n`;
                commentBody += `---\n\n`;
              }
            }
          }

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody
          });
